services:
  spotibase-db:
    image: postgres:16-alpine
    container_name: spotibase-db
    environment:
      POSTGRES_DB: spotibase
      POSTGRES_USER: spotibase
      POSTGRES_PASSWORD: spotibase_local_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d/flyway-migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotibase -d spotibase"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotibase-network

  spotibase-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotibase-backend
    ports:
      - "8080:8088"
    environment:
      - SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_REF}
      - SUPABASE_DB_USERNAME=spotibase
      - SUPABASE_DB_PASSWORD=spotibase_local_dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://spotibase-db:5432/spotibase?sslmode=disable
      - SPRING_DATASOURCE_USERNAME=spotibase
      - SPRING_DATASOURCE_PASSWORD=spotibase_local_dev
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=${SMTP_HOST:-smtp.sendgrid.net}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8088}
      - SERVER_PORT=8088
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081,exp://localhost:19000}
      # Cloudflare R2 (songs)
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      # SpotiBase AI (FastAPI) - individual Python AI server
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_SERVICE_URL=http://spotibase-ai:7860
      - AI_MODE=${AI_MODE:-mock}
      - QWEN_MODEL=${QWEN_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - STT_MODE=${STT_MODE:-mock}
      - STT_MODEL=${STT_MODEL:-small}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - spotibase-db
      - redis
      - spotibase-ai
    restart: unless-stopped
    networks:
      - spotibase-network

  spotibase-ai:
    build:
      context: ./spotibase-ai
      dockerfile: Dockerfile
    container_name: spotibase-ai
    ports:
      - "7860:7860"
    environment:
      - AI_MODE=${AI_MODE:-mock}
      - STT_MODE=${STT_MODE:-mock}
      - STT_MODEL=${STT_MODEL:-small}
      - QWEN_MODEL=${QWEN_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - HF_TOKEN=${HF_TOKEN:-}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - spotibase-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7860/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spotibase-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - spotibase-network

volumes:
  postgres-data:
  redis-data:

networks:
  spotibase-network:
    driver: bridge
