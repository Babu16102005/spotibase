name: Full Stack CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend-changed: ${{ steps.filter.outputs.backend }}
      mobile-changed: ${{ steps.filter.outputs.mobile }}
      docs-changed: ${{ steps.filter.outputs.docs }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            mobile:
              - 'mobile/**'
            docs:
              - '*.md'
              - 'docs/**'
              - '.github/**'

  backend:
    name: Backend Pipeline
    needs: validate
    if: needs.validate.outputs.backend-changed == 'true'
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  mobile:
    name: Mobile Pipeline
    needs: validate
    if: needs.validate.outputs.mobile-changed == 'true'
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    if: always() && (needs.validate.outputs.backend-changed == 'true' || needs.validate.outputs.mobile-changed == 'true')
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t spotibase-backend:test ./backend

      - name: Build mobile web image
        run: docker build -t spotibase-mobile:test ./mobile -f Dockerfile.web

      - name: Start services
        run: |
          docker network create spotibase-test
          docker run -d --name postgres-test --network spotibase-test \
            -e POSTGRES_DB=spotibase_test \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            postgres:16-alpine
          sleep 10
          docker run -d --name backend-test --network spotibase-test \
            -e SPRING_PROFILES_ACTIVE=test \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-test:5432/spotibase_test \
            -e SPRING_DATASOURCE_USERNAME=test \
            -e SPRING_DATASOURCE_PASSWORD=test \
            -p 8088:8088 \
            spotibase-backend:test
          sleep 30

      - name: Health check backend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8088/actuator/health; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          docker logs backend-test
          exit 1

      - name: Health check mobile
        run: |
          docker run -d --name mobile-test --network spotibase-test \
            -p 3000:3000 \
            spotibase-mobile:test
          sleep 10
          curl -f http://localhost:3000

      - name: Cleanup
        if: always()
        run: |
          docker stop backend-test mobile-test postgres-test 2>/dev/null || true
          docker rm backend-test mobile-test postgres-test 2>/dev/null || true
          docker network rm spotibase-test 2>/dev/null || true

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [backend, mobile, docker-compose-test]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Send notification
        run: |
          STATUS="${{ needs.backend.result }},${{ needs.mobile.result }},${{ needs.docker-compose-test.result }}"
          echo "Build status: $STATUS"
          if [[ "$STATUS" == *"failure"* ]]; then
            echo "::warning::Some jobs failed"
            # Add Slack/Discord/Email notification here
          fi