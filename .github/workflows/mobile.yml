name: Mobile CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
  workflow_call:

env:
  NODE_VERSION: '20'
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: |
          node --version
          npm --version
          set +e
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1
          status=$?
          cat /tmp/npm-ci.log
          if [ $status -ne 0 ]; then
            echo "::error::npm ci failed with exit $status"
            tail -80 /tmp/npm-ci.log | sed 's/^/::error::/'
            exit $status
          fi

      - name: Run ESLint
        working-directory: ./mobile
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./mobile
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: |
          node --version
          npm --version
          set +e
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1
          status=$?
          cat /tmp/npm-ci.log
          if [ $status -ne 0 ]; then
            echo "::error::npm ci failed with exit $status"
            tail -80 /tmp/npm-ci.log | sed 's/^/::error::/'
            exit $status
          fi

      - name: Run tests
        working-directory: ./mobile
        run: npm test -- --ci --coverage --maxWorkers=2

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/
          retention-days: 7

  build-web:
    name: Build Web (Expo Export)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: |
          node --version
          npm --version
          set +e
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1
          status=$?
          cat /tmp/npm-ci.log
          if [ $status -ne 0 ]; then
            echo "::error::npm ci failed with exit $status"
            tail -80 /tmp/npm-ci.log | sed 's/^/::error::/'
            exit $status
          fi

      - name: Install Expo CLI
        working-directory: ./mobile
        run: npm install -g @expo/cli

      - name: Build web export
        working-directory: ./mobile
        run: npm run web:build
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: mobile/dist-prod/
          retention-days: 7

      - name: Verify build output
        run: |
          ls -la mobile/dist-prod/
          test -f mobile/dist-prod/index.html
          test -f mobile/dist-prod/manifest.json
          test -f mobile/dist-prod/sw.js

  build-android:
    name: Build Android (EAS)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    timeout-minutes: 60
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    env:
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: |
          node --version
          npm --version
          set +e
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1
          status=$?
          cat /tmp/npm-ci.log
          if [ $status -ne 0 ]; then
            echo "::error::npm ci failed with exit $status"
            tail -80 /tmp/npm-ci.log | sed 's/^/::error::/'
            exit $status
          fi

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Configure EAS
        run: |
          echo "$EAS_CONFIG" > eas.json
        env:
          EAS_CONFIG: ${{ secrets.EAS_CONFIG }}

      - name: Build Android
        if: env.HAS_EXPO_TOKEN == 'true'
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

  build-ios:
    name: Build iOS (EAS)
    runs-on: macos-latest
    needs: [lint-and-typecheck, test]
    timeout-minutes: 60
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    env:
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: |
          node --version
          npm --version
          set +e
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1
          status=$?
          cat /tmp/npm-ci.log
          if [ $status -ne 0 ]; then
            echo "::error::npm ci failed with exit $status"
            tail -80 /tmp/npm-ci.log | sed 's/^/::error::/'
            exit $status
          fi

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Configure EAS
        run: |
          echo "$EAS_CONFIG" > eas.json
        env:
          EAS_CONFIG: ${{ secrets.EAS_CONFIG }}

      - name: Build iOS
        if: env.HAS_EXPO_TOKEN == 'true'
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

  deploy-web-preview:
    name: Deploy Web Preview (Vercel)
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'pull_request'
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    timeout-minutes: 10

    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist-prod/

      - name: Deploy to Vercel Preview
        if: env.HAS_VERCEL_TOKEN == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'
          working-directory: ./dist-prod

  deploy-web-production:
    name: Deploy Web Production (Vercel)
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    timeout-minutes: 10
    environment: production

    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist-prod/

      - name: Deploy to Vercel Production
        if: env.HAS_VERCEL_TOKEN == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=true'
          working-directory: ./dist-prod