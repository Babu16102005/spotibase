name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.6'

jobs:
  test:
    name: Test (Java ${{ env.JAVA_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spotibase_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d spotibase_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Set up Maven
        uses: actions/setup-maven@v4
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>test</id>
                <properties>
                  <spring.profiles.active>test</spring.profiles.active>
                  <supabase.url>http://localhost:5432</supabase.url>
                  <supabase.service-role-key>test</supabase.service-role-key>
                  <supabase.storage.bucket>test</supabase.storage.bucket>
                  <supabase.storage.covers-path>covers</supabase.storage.covers-path>
                  <supabase.storage.avatars-path>avatars</supabase.storage.avatars-path>
                  <r2.account-id>test</r2.account-id>
                  <r2.access-key-id>test</r2.access-key-id>
                  <r2.secret-access-key>test</r2.secret-access-key>
                  <r2.bucket-name>test</r2.bucket-name>
                  <r2.public-url>http://localhost:9000</r2.public-url>
                  <jwt.secret>test-secret-key-for-testing-purposes-only-must-be-32-chars-min</jwt.secret>
                  <jwt.expiration>3600000</jwt.expiration>
                  <jwt.refresh-expiration>604800000</jwt.refresh-expiration>
                  <mail.host>localhost</mail.host>
                  <mail.port>1025</mail.port>
                  <mail.username>test</mail.username>
                  <mail.password>test</mail.password>
                  <mail.from>test@spotibase.local</mail.from>
                  <openai.api-key>test</openai.api-key>
                  <app.base-url>http://localhost:8088</app.base-url>
                  <app.frontend-url>http://localhost:3000</app.frontend-url>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>test</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        working-directory: ./backend
        run: |
          mvn -B test -DskipITs -Dspring.profiles.active=test \
            -Dsupabase.url=jdbc:postgresql://localhost:5432/spotibase_test \
            -Dsupabase.service-role-key=test \
            -Dsupabase.storage.bucket=test \
            -Dsupabase.storage.covers-path=covers \
            -Dsupabase.storage.avatars-path=avatars \
            -Dr2.account-id=test \
            -Dr2.access-key-id=test \
            -Dr2.secret-access-key=test \
            -Dr2.bucket-name=test \
            -Dr2.public-url=http://localhost:9000 \
            -Djwt.secret=test-secret-key-for-testing-purposes-only-must-be-32-chars-min \
            -Djwt.expiration=3600000 \
            -Djwt.refresh-expiration=604800000 \
            -Dmail.host=localhost \
            -Dmail.port=1025 \
            -Dmail.username=test \
            -Dmail.password=test \
            -Dmail.from=test@spotibase.local \
            -Dopenai.api-key=test \
            -Dapp.base-url=http://localhost:8088 \
            -Dapp.frontend-url=http://localhost:3000

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 7

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR
        working-directory: ./backend
        run: mvn -B package -DskipTests -Dspring.profiles.active=prod

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.ref_name }},enable={{!is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          # Add your staging deployment commands here
          # e.g., kubectl apply, docker-compose, etc.

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production environment"
          # Add your production deployment commands here
          # e.g., kubectl apply, docker-compose, etc.