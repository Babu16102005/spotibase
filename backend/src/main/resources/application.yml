server:
  port: ${SERVER_PORT:8088}
  tomcat:
    max-swallow-size: 300MB
    max-http-form-post-size: 300MB

spring:
  application:
    name: spotibase-backend

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

  cache:
    # Shared Redis (same server the AI service uses). Falls back gracefully:
    # cache ops time out fast; song pages still load, just uncached.
    type: redis
    redis:
      time-to-live: 90s

  datasource:
    # Host/dev runs must provide this explicitly. A stale hardcoded Supabase
    # pooler URL caused repeated auth failures that looked like bean failures.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.${SUPABASE_PROJECT_REF}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      # Aggressively cycle connections to prevent drops from hanging the pool
      idle-timeout: 15000
      max-lifetime: 30000
      keepalive-time: 0
      connection-timeout: 15000
      validation-timeout: 1000
      connection-test-query: SELECT 1
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The schema was created by supabase-schema.sql (up to V18) without a
    # history table. Baseline at 18 so only V19+ migrations apply.
    baseline-on-migrate: true
    baseline-version: 18
    validate-on-migrate: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 250MB
      max-request-size: 300MB

  # Shared Redis cache server (localhost for host runs, `redis` in compose).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

# SpotiBase AI (FastAPI) - individual Python AI server
ai-service:
  enabled: ${AI_ENABLED:true}
  service-url: ${AI_SERVICE_URL:http://localhost:7860}
  fallback-on-error: true
ai:
  enabled: ${AI_ENABLED:true}
  service-url: ${AI_SERVICE_URL:http://localhost:7860}
  fallback-on-error: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  mail:
    host: ${SMTP_HOST:smtp.sendgrid.net}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Cloudflare R2 Storage (for songs only)
r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  public-url: ${R2_PUBLIC_URL:}
  region: auto
  songs-path: songs

# Supabase
supabase:
  url: https://${SUPABASE_PROJECT_REF}.supabase.co
  anon-key: ${SUPABASE_ANON_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  jwt-secret: ${SUPABASE_JWT_SECRET}
  storage:
    bucket: spotibase
    songs-path: songs
    covers-path: covers
    avatars-path: avatars

# Apple Sign-In (id_token verification; required for /auth/social/apple)
apple:
  client-id: ${APPLE_CLIENT_ID:}

# JWT
jwt:
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours (ms)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}  # 30 days (ms)

# App
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,exp://localhost:19000}

# Logging
logging:
  level:
    com.spotibase: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # No SMTP is configured; without this the MailHealthIndicator makes
      # /actuator/health report DOWN (503) even though the app is healthy.
      enabled: false

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
