# Nginx configuration for SpotiBase Mobile Web (PWA)

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;

    # CSP for PWA
    add_header Content-Security-Policy "
        default-src 'self' https: data: blob:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;
        style-src 'self' 'unsafe-inline' https:;
        img-src 'self' data: blob: https:;
        font-src 'self' data: https:;
        connect-src 'self' https: wss:;
        media-src 'self' blob: https:;
        worker-src 'self' blob:;
        manifest-src 'self';
    " always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_http_version 1.1;
    gzip_proxied expired no-cache no-store private auth;
    # Serve pre-compressed .gz files if present (produced at build time).
    gzip_static on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml
               application/javascript application/json application/wasm
               font/woff font/woff2 image/svg+xml;

    # Brotli compression
    # NOTE: The official `nginx:alpine` image does NOT ship the ngx_brotli module,
    # so enabling `brotli on` would fail `nginx -t`. gzip_static above is the
    # reliable path. To use Brotli, build a custom nginx image that compiles in
    # ngx_brotli, then uncomment these lines.
    # brotli on;
    # brotli_vary on;
    # brotli_comp_level 6;
    # brotli_min_length 1024;
    # brotli_static on;
    # brotli_types text/plain text/css text/xml text/javascript application/x-javascript application/xml
    #             application/javascript application/json application/wasm
    #             font/woff font/woff2 image/svg+xml;

    # Hashed, content-addressed Expo bundles - long-term immutable caching.
    # These files never change once built (content hashed), so cache forever.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Hashed static assets (chunks, fonts, images) - long-term immutable caching.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Static assets - long-term caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Service Worker - no cache
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Manifest - no cache
    location /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # WebSocket proxy for real-time features
    location /ws/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache HTML for short time
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}